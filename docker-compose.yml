version: '3.8'

services:
  telegram-hermes-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-hermes-webhook
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HERMES_URL=${HERMES_URL:-http://100.86.232.77:8080}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - LOG_LEVEL=INFO
    volumes:
      - ./obsidian_vault:/app/obsidian_vault
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: telegram-hermes-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - telegram-hermes-webhook
    restart: unless-stopped
    networks:
      - hermes-network

networks:
  hermes-network:
    driver: bridge

volumes:
  vault_data:
  logs:
